  <title id="title">Overall reported errors per 1,000 cases, April to August</title>
  <desc id="description">A full-operation trend, starting at zero on the vertical axis. April 4.07, May 3.29, June 2.62, July 2.10, August 1.42. The tool rolled out at the beginning of July. The decline started before rollout, so this chart does not isolate the tool’s effect.</desc>
